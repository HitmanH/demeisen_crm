# Tests and deploys the API code and web page when they change on main. The AWS role can only
# update this function and this page; infrastructure changes still use scripts/deploy.ps1.
name: Deploy
on:
  push:
    branches: [main]
    paths: ['api/**', 'web/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
concurrency: deploy
env:
  AWS_REGION: eu-west-2
  FUNCTION: demeisen-crm-poc-api
  SITE_BUCKET: demeisen-crm-poc-sitebucket-bztedpdcivqj
  SITE_URL: https://d1ld7k58u2qhpo.cloudfront.net
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install and test
        working-directory: api
        run: |
          npm ci --no-audit --no-fund
          npm test
      - name: Check the page's script
        run: |
          python3 - <<'EOF'
          import re
          html = open('web/index.html', encoding='utf-8').read()
          open('/tmp/page.js', 'w', encoding='utf-8').write(re.findall(r'<script>([\s\S]*?)</script>', html)[-1])
          EOF
          node --check /tmp/page.js
      - name: Build
        working-directory: api
        run: |
          npm ci --omit=dev --no-audit --no-fund
          curl -fsS "https://truststore.pki.rds.amazonaws.com/$AWS_REGION/$AWS_REGION-bundle.pem" -o rds-ca.pem
          zip -qr function.zip src node_modules package.json rds-ca.pem
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::642552605309:role/demeisen-crm-github-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy API code
        run: |
          aws lambda update-function-code --function-name "$FUNCTION" --zip-file fileb://api/function.zip --query LastUpdateStatus --output text
          aws lambda wait function-updated-v2 --function-name "$FUNCTION"
      - name: Deploy page
        run: aws s3 cp web/index.html "s3://$SITE_BUCKET/index.html" --content-type 'text/html; charset=utf-8'
      - name: Check the live site
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/")" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/api/data")" = 401
