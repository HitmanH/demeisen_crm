<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demeisen CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<style>
/* Layout: sticky header with tabs over a single 1180px column; the to-do view adds a side rail that stacks below 900px */
:root {
  --bg: #F3F5F8;
  --surface: #FFFFFF;
  --ink: #18212E;
  --muted: #5B6676;
  --line: #DCE1E8;
  --hover: #F7F9FB;
  --accent: #1E4D8C;
  --accent-soft: #E3ECF8;
  --on-accent: #FFFFFF;
  --ci: #22706C;
  --ci-soft: #DDF0EE;
  --dem: #4A4F8C;
  --dem-soft: #E8E9F6;
  --intel: #8A5A12;
  --intel-soft: #F6ECDB;
  --ok: #2F7A4F;
  --ok-soft: #E0F1E7;
  --warn: #9A6200;
  --crit: #B3261E;
  --crit-soft: #FBE4E2;
  --mark: #FFE7A3;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --f-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F141B; --surface: #171E28; --ink: #E6EAF0; --muted: #97A3B4; --line: #2A3442; --hover: #1C2531;
    --accent: #86ADE8; --accent-soft: #1D2B40; --on-accent: #0F141B;
    --ci: #6FC7C1; --ci-soft: #14302E; --dem: #A9ADE8; --dem-soft: #24264A;
    --intel: #DDB06A; --intel-soft: #2E2618; --ok: #6CC08F; --ok-soft: #17291F;
    --warn: #E2A93B; --crit: #F08A82; --crit-soft: #34191A; --mark: #5A4A16;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F141B; --surface: #171E28; --ink: #E6EAF0; --muted: #97A3B4; --line: #2A3442; --hover: #1C2531;
  --accent: #86ADE8; --accent-soft: #1D2B40; --on-accent: #0F141B;
  --ci: #6FC7C1; --ci-soft: #14302E; --dem: #A9ADE8; --dem-soft: #24264A;
  --intel: #DDB06A; --intel-soft: #2E2618; --ok: #6CC08F; --ok-soft: #17291F;
  --warn: #E2A93B; --crit: #F08A82; --crit-soft: #34191A; --mark: #5A4A16;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* Header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; padding-block: 10px; }
.brand { font-family: var(--f-display); font-size: 20px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; }
.brand span { font-family: var(--f-body); font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-left: 8px; }
nav.tabs { display: flex; flex-wrap: wrap; gap: 2px; flex: 1; min-width: 0; }
nav.tabs a { padding: 8px 12px; border-radius: var(--r); color: var(--muted); text-decoration: none; font-weight: 500; white-space: nowrap; }
nav.tabs a:hover { color: var(--ink); background: var(--hover); }
nav.tabs a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
@media (max-width: 900px) {
  header.top { position: static; }
  header.top .wrap { gap: 8px; }
  nav.tabs a { padding: 6px 10px; }
}
.proforma { background: var(--intel-soft); border-bottom: 1px solid var(--line); font-size: 12.5px; }
.proforma .wrap { padding-block: 6px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.proforma strong { color: var(--intel); letter-spacing: 0.06em; text-transform: uppercase; font-size: 11px; margin-right: 6px; }

main .wrap { padding-block: 24px 72px; }
h1 { font-family: var(--f-display); font-size: 26px; font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h2 { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0; display: flex; gap: 8px; align-items: baseline; }
.pagehead { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.sub { color: var(--muted); margin: 4px 0 0; max-width: 65ch; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.stack { display: flex; flex-direction: column; gap: 20px; }

/* Controls */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: var(--r); border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); font-weight: 500; cursor: pointer; white-space: nowrap; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--accent); border-color: var(--line); }
.btn.ghost:hover { background: var(--hover); filter: none; }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
input[type="text"], input[type="email"], input[type="search"], input[type="date"], input[type="tel"], select, textarea {
  width: 100%; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface);
}
textarea { resize: vertical; min-height: 84px; line-height: 1.5; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.lbl { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.lbl em { font-style: normal; font-weight: 400; text-transform: none; letter-spacing: 0; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.span-all { grid-column: 1 / -1; }
.form-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.form-error { color: var(--crit); font-weight: 500; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { padding: 8px 16px; cursor: pointer; font-weight: 500; color: var(--muted); }
.seg label + input + label { border-left: 1px solid var(--line); }
.seg input:checked + label { background: var(--accent); color: var(--on-accent); }
.seg input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: -2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chk { display: inline-flex; gap: 8px; align-items: center; padding: 5px 12px 5px 9px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; background: var(--surface); }
.chk:has(input:checked) { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

/* Pills */
.pill { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; line-height: 1.6; }
.pill.inv { background: var(--accent-soft); color: var(--accent); }
.pill.ci { background: var(--ci-soft); color: var(--ci); }
.pill.dem { background: var(--dem-soft); color: var(--dem); }
.pill.oth { background: var(--hover); color: var(--muted); border: 1px solid var(--line); }
.review-note { font-size: 12.5px; color: var(--warn); }
.proforma details { font-size: 12.5px; }
.proforma details ul { margin: 6px 0 0; padding-left: 18px; max-height: 160px; overflow: auto; }
.proforma h1 { flex-basis: 100%; margin: 12px 0 4px; }
.proforma .acts-row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.proforma .unsaved { display: inline-block; margin-left: 6px; font-weight: 600; color: var(--crit); }
.pill.intel { background: var(--intel-soft); color: var(--intel); }
.pill.ixn { background: var(--hover); color: var(--ink); border: 1px solid var(--line); }
.pill.done { background: var(--ok-soft); color: var(--ok); }
.pill.open { background: var(--hover); color: var(--muted); border: 1px solid var(--line); }
button.pill { border: 0; cursor: pointer; font: inherit; font-size: 12px; font-weight: 500; }

/* To-do */
.todo-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; align-items: start; }
@media (max-width: 900px) { .todo-grid { grid-template-columns: minmax(0, 1fr); } }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 640px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: var(--ink); }
.tile:hover { background: var(--hover); }
.tile .n { font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.tile.crit .n { color: var(--crit); }
.tile.warn .n { color: var(--warn); }
.toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.toolbar select { width: auto; }
.quickadd { padding: 12px; display: grid; grid-template-columns: minmax(0, 1fr) 170px 150px auto; gap: 8px; }
@media (max-width: 640px) { .quickadd { grid-template-columns: 1fr 1fr; } .quickadd > :first-child, .quickadd > :last-child { grid-column: 1 / -1; } }
.group { display: flex; flex-direction: column; gap: 8px; }
ul.acts { list-style: none; margin: 0; padding: 0; }
.act { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.act:last-child { border-bottom: 0; }
.act input[type="checkbox"] { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--accent); cursor: pointer; }
.act-desc { font-weight: 500; cursor: pointer; }
.act.is-done .act-desc { text-decoration: line-through; color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; color: var(--muted); font-size: 13px; margin-top: 3px; }
.due { font-family: var(--f-mono); font-size: 12.5px; white-space: nowrap; padding-top: 2px; color: var(--muted); }
.due.overdue { color: var(--crit); font-weight: 500; }
.due.week { color: var(--warn); }
.empty { padding: 16px 14px; color: var(--muted); }
.feed { list-style: none; margin: 0; padding: 0; }
.feed li { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
.feed li:last-child { border-bottom: 0; }
.feed .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; }
.feed .txt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.feed button.open-int { all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
.feed button.open-int:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.rail-head { padding: 12px 14px; border-bottom: 1px solid var(--line); }

/* Log form */
.log-form { padding: 20px; display: flex; flex-direction: column; gap: 20px; }
.hint { font-size: 13px; color: var(--muted); }
.pgroup { display: flex; flex-direction: column; gap: 8px; }
.people-box { display: flex; flex-direction: column; gap: 14px; }
.arows { display: flex; flex-direction: column; gap: 8px; }
.arow { display: grid; grid-template-columns: minmax(0, 1fr) 170px 150px auto; gap: 8px; }
@media (max-width: 640px) { .arow { grid-template-columns: 1fr 1fr; } .arow > :first-child { grid-column: 1 / -1; } }
.section-rule { border: 0; border-top: 1px solid var(--line); margin: 0; }

/* Search */
.filters { padding: 14px; display: grid; grid-template-columns: minmax(0, 2fr) repeat(3, minmax(0, 1fr)); gap: 10px; }
.filters .dates { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; grid-column: span 2; }
@media (max-width: 800px) { .filters { grid-template-columns: 1fr 1fr; } .filters > :first-child { grid-column: 1 / -1; } }
.results { display: flex; flex-direction: column; gap: 12px; }
.ix { padding: 16px; display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 120px; }
.ix.flash { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.ix-head { display: flex; gap: 8px 10px; flex-wrap: wrap; align-items: center; font-size: 13px; }
.ix-head .mono { font-weight: 500; }
.ix p { margin: 0; max-width: 75ch; white-space: pre-wrap; }
.ix .next { padding: 10px 12px; background: var(--hover); border-radius: var(--r); }
.ix ul.mini { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.ix ul.mini li { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
mark { background: var(--mark); color: inherit; padding: 0 1px; border-radius: 2px; }

/* Overview & one-pager */
.two-col { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 900px) { .two-col { grid-template-columns: minmax(0, 1fr); } }
.tile .n.date { font-size: 20px; padding-block: 4px; }
.tile .small { font-size: 12.5px; color: var(--muted); }
.op-head { padding: 18px 20px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
.op-name { font-family: var(--f-display); font-size: 30px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.op-tags { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
.op-facts { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); margin-top: 10px; max-width: 70ch; }
.op-facts strong { color: var(--ink); font-weight: 500; }
.op-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.sec-head { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.sec-foot { padding: 10px 14px; border-top: 1px solid var(--line); }
.months { display: flex; gap: 8px; padding: 12px 14px 10px; }
.month { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.month .barwrap { height: 56px; width: 100%; display: flex; align-items: flex-end; justify-content: center; }
.month .bar { width: 100%; max-width: 34px; background: var(--accent); border-radius: 3px 3px 0 0; }
.month .bar.zero { background: var(--line); }
.month .cnt { font-family: var(--f-mono); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.month .m { font-size: 11px; color: var(--muted); }
.feed .txt.three { -webkit-line-clamp: 3; }
.feed .row .by { margin-left: auto; white-space: nowrap; }
.feed .row .by::before { content: "by "; }
.small-tbl th, .small-tbl td { padding: 8px 14px; font-size: 13px; }
.chip-btns { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 14px; }
.chip-btns button { font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.chip-btns button:hover { border-color: var(--accent); color: var(--accent); }
.chip-btns .mono { color: var(--muted); margin-left: 4px; }
.next-list { list-style: none; margin: 0; padding: 0; }
.next-list li { padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.next-list li:last-child { border-bottom: 0; }
.next-list .mono { color: var(--muted); font-size: 12px; margin-right: 6px; }

/* Interactions list */
.seg label .mono { opacity: 0.75; font-size: 12px; margin-left: 4px; }
.ix-table td { vertical-align: top; }
.ix-row { cursor: pointer; }
.ix-row.is-open, tbody tr.ix-open, tbody tr.ix-open:hover { background: var(--hover); }
tbody tr.ix-open td { padding-top: 0; }
.ix-table .nowrap { white-space: nowrap; }
.ix-table .ppl { min-width: 140px; max-width: 220px; color: var(--muted); font-size: 13px; }
.ix-table .clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-width: 260px; max-width: 60ch; }
.ix-detail { display: flex; flex-direction: column; gap: 10px; padding-bottom: 8px; max-width: 90ch; }
.ix-detail p { margin: 0; white-space: pre-wrap; }
.ix-detail .next { padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.ix-detail ul.mini { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.ix-detail ul.mini li { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* Tables */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: var(--hover); }
td.num, th.num { text-align: right; }
.warn-note { color: var(--warn); font-size: 12px; margin-left: 6px; font-family: var(--f-body); }
.edit-panel { padding: 18px; display: flex; flex-direction: column; gap: 14px; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: var(--r); font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 20; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">Demeisen <span>Investor CRM</span></div>
    <nav class="tabs" aria-label="Sections">
      <a href="#home" data-view="home">Overview</a>
      <a href="#todo" data-view="todo">To-do</a>
      <a href="#interactions" data-view="interactions">Interactions</a>
      <a href="#allocator" data-view="allocator">External Party One Pager</a>
      <a href="#log" data-view="log">Log interaction / intel</a>
      <a href="#search" data-view="search">Search</a>
      <a href="#companies" data-view="companies">Companies</a>
      <a href="#people" data-view="people">People</a>
      <a href="#settings" data-view="settings">Settings</a>
    </nav>
  </div>
</header>
<div class="proforma" id="settings-pane" style="display:none">
  <div class="wrap">
    <h1>Settings</h1>
    <div id="data-status"></div>
    <div class="acts-row">
      <label class="btn ghost sm" for="import-file" style="cursor:pointer">Import workbook (.xlsx)</label>
      <input type="file" id="import-file" accept=".xlsx,.xlsm" hidden>
      <button type="button" class="btn sm" id="export">Save workbook (.xlsx)</button>
      <button type="button" class="linkbtn" id="reset">Reset to example data</button>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<main><div class="wrap" id="view"></div></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const KEY = 'demeisen-crm-proforma-v2';
// config.js exists only on the hosted site. Without it, the page runs on browser storage as before.
const CFG = window.CRM_CONFIG || null, LIVE = !!CFG;
const TODAY = new Date(); TODAY.setHours(0, 0, 0, 0);
const iso = x => x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
const rel = n => { const x = new Date(TODAY); x.setDate(x.getDate() + n); return iso(x); };
const daysFrom = s => Math.round((new Date(s + 'T00:00') - TODAY) / 864e5);
const fmt = s => s ? new Date(s + 'T00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

function seed() {
  // Fictional example data shown until a workbook is imported. Never put real names here.
  return {

/* ---------- Hosted site: sign-in (authorization code with PKCE) and API calls ---------- */
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const randomStr = () => b64url(crypto.getRandomValues(new Uint8Array(32)));
const redirectUri = () => location.origin + '/';
const claims = t => JSON.parse(decodeURIComponent(escape(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')))));
function idToken() {
  const t = sessionStorage.getItem('crm-id-token');
  return t && claims(t).exp * 1000 > Date.now() + 30000 ? t : null;
}
async function signIn() {
  const verifier = randomStr(), state = randomStr();
  sessionStorage.setItem('crm-pkce', JSON.stringify({ verifier, state, hash: location.hash }));
  const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  location.assign(`https://${CFG.authDomain}/oauth2/authorize?` + new URLSearchParams({ response_type: 'code', client_id: CFG.clientId,
    redirect_uri: redirectUri(), scope: 'openid email', state, code_challenge_method: 'S256', code_challenge: challenge }));
}
async function finishSignIn() {
  const q = new URLSearchParams(location.search), code = q.get('code');
  if (!code) return false;
  const saved = JSON.parse(sessionStorage.getItem('crm-pkce') || '{}');
  sessionStorage.removeItem('crm-pkce');
  history.replaceState(null, '', '/' + (saved.hash || ''));
  if (q.get('state') !== saved.state) throw new Error('Sign-in could not be verified. Please try again.');
  const r = await fetch(`https://${CFG.authDomain}/oauth2/token`, { method: 'POST', headers: { 'content-type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ grant_type: 'authorization_code', client_id: CFG.clientId, code, redirect_uri: redirectUri(), code_verifier: saved.verifier }) });
  if (!r.ok) throw new Error('Sign-in failed. Please try again.');
  sessionStorage.setItem('crm-id-token', (await r.json()).id_token);
  return true;
}
function signOut() {
  sessionStorage.removeItem('crm-id-token');
  location.assign(`https://${CFG.authDomain}/logout?` + new URLSearchParams({ client_id: CFG.clientId, logout_uri: redirectUri() }));
}
async function api(method, path, body) {
  const t = idToken();
  if (!t) { await signIn(); throw new Error('Signing in again.'); }
  const r = await fetch(path, { method, headers: { authorization: `Bearer ${t}`, ...(body ? { 'content-type': 'application/json' } : {}) }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { sessionStorage.removeItem('crm-id-token'); await signIn(); throw new Error('Signing in again.'); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(data.error || 'That could not be saved.'); e.status = r.status; throw e; }
  return data;
}
async function reloadData() { db = await api('GET', '/api/data'); }
// Runs a write. On a conflict, loads the latest data so the person sees what changed.
async function liveWrite(fn, errEl) {
  try { return await fn(); }
  catch (e) {
    if (errEl) errEl.textContent = e.message; else toast(e.message);
    if (e.status === 409) { await reloadData().catch(() => {}); if (!errEl) route(); }
    return null;
  }
}

let todoOwner = 'all', showDone = false;
function bucket(a) {
  if (!a.due) return 'nodate';
  const d = daysFrom(a.due);
  return d < 0 ? 'overdue' : d <= 7 ? 'week' : 'later';
}
function dueLabel(a) {
  if (!a.due) return 'No date';
  const d = daysFrom(a.due);
  if (a.status !== 'Open') return fmt(a.due);
  if (d < 0) return `${-d} day${d === -1 ? '' : 's'} overdue`;
  if (d === 0) return 'Today';
  if (d === 1) return 'Tomorrow';
  if (d <= 7) return `In ${d} days`;
  return fmt(a.due);
}
function actionRow(a) {
  const it = a.interactionId ? byId(db.interactions, a.interactionId) : null;
  const co = it && it.companyId ? company(it.companyId) : null;
  const owner = person(a.ownerId);
  return `<li class="act ${a.status !== 'Open' ? 'is-done' : ''}">

}

          <input type="date" id="qa-due" aria-label="Due date">

        </form>
        ${['overdue', 'week', 'later', 'nodate'].map(k => `
          <section class="group" id="grp-${k}">

    if (!desc) { err.textContent = 'Add a description.'; f.querySelector('#lg-desc').focus(); return; }
    if (LIVE) {
      const actions = [...f.querySelectorAll('.arow')].map(r => ({ id: +r.dataset.aid || null, desc: r.querySelector('.a-desc').value.trim(), ownerId: +r.querySelector('.a-owner').value || null, due: r.querySelector('.a-due').value })).filter(a => a.desc);
      const payload = { type, date, companyId, recordedBy: +f.querySelector('#lg-by').value || null, people: checkedPeople(),
        format: type === 'Interaction' ? f.querySelector('#lg-kind').value : (ed?.format || 'Feedback'), viaId: +f.querySelector('#lg-via').value || null,
        desc, next: f.querySelector('#lg-next').value.trim(), actions, expectedValidFrom: ed?.validFrom };
      const btn = f.querySelector('button[type="submit"]'); btn.disabled = true; err.textContent = '';
      liveWrite(async () => {
        const res = await api(ed ? 'PUT' : 'POST', ed ? `/api/interactions/${ed.id}` : '/api/interactions', payload);
        await reloadData();
        toast(ed ? 'Entry updated' : `${type} saved`);
        openInteraction(res.id);
      }, err).finally(() => { btn.disabled = false; });
      return;
    }
    const id = ed ? ed.id : nextId(db.interactions);
    const entry = { id, type, date, companyId, recordedBy: +f.querySelector('#lg-by').value || null, people: checkedPeople(),
      format: type === 'Interaction' ? f.querySelector('#lg-kind').value : (ed?.format || 'Feedback'), viaId: +f.querySelector('#lg-via').value || null,
      desc, next: f.querySelector('#lg-next').value.trim(), review: ed ? ed.review : '', updated: new Date().toISOString() };
    if (ed) Object.assign(ed, entry); else db.interactions.push(entry);
    // Rows that came from existing actions update them; removed rows delete them; blank rows are ignored.
    const kept = new Set();
    let n = 0;
    f.querySelectorAll('.arow').forEach(r => {
      const d = r.querySelector('.a-desc').value.trim();
      if (!d) return;
      const fields = { desc: d, ownerId: +r.querySelector('.a-owner').value || null, due: r.querySelector('.a-due').value };
      const old = r.dataset.aid && byId(db.actions, +r.dataset.aid);
      if (old) { Object.assign(old, fields); kept.add(old.id); }
      else { db.actions.push({ id: nextId(db.actions), ...fields, interactionId: id, status: 'Open' }); n++; }
    });
    const dropped = edActs.filter(a => !kept.has(a.id));
    if (dropped.length) db.actions = db.actions.filter(a => !dropped.includes(a));
    save();
    toast(ed ? 'Entry updated' : `${type} saved${n ? ` with ${n} action${n > 1 ? 's' : ''}` : ''}`);
    openInteraction(id);
  });
}

    </div>

function renderResults() {
  const terms = ss.q.toLowerCase().split(/\s+/).filter(Boolean);
  const rows = db.interactions.filter(it => {
    if (ss.type !== 'all' && it.type !== ss.type) return false;
    if (ss.company && it.companyId !== +ss.company) return false;
    if (ss.person && !it.people.includes(+ss.person) && it.recordedBy !== +ss.person) return false;
    if (ss.from && it.date < ss.from) return false;
    if (ss.to && it.date > ss.to) return false;
    if (terms.length) {
      const hay = [it.desc, it.next, company(it.companyId)?.name, company(it.viaId)?.name, ...it.people.map(id => person(id)?.name)].join(' ').toLowerCase();
      if (!terms.every(t => hay.includes(t))) return false;
    }
    return true;
  }).sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
  view.querySelector('#s-count').textContent = `${rows.length} entr${rows.length === 1 ? 'y' : 'ies'}`;
  view.querySelector('#s-results').innerHTML = rows.length ? rows.map(it => {
    const co = it.companyId ? company(it.companyId) : null;
    const acts = db.actions.filter(a => a.interactionId === it.id);
    const ppl = it.people.map(person).filter(Boolean);
    return `<article class="panel ix" id="ix-${it.id}">
      <div class="ix-head"><span class="mono">${fmt(it.date)}</span>${typePill(it.type)}${it.format ? `<span class="muted">${esc(it.format)}</span>` : ''}

        ${it.viaId && company(it.viaId) ? `<span class="muted">via</span><span class="pill ci">${esc(company(it.viaId).name)}</span>` : ''}

}

/* ---------- Workbook import (runs in this browser only; nothing is uploaded) ---------- */
const str = v => String(v ?? '').trim();
const lc = v => str(v).toLowerCase();
function readSheet(wb, name) {
  const key = wb.SheetNames.find(n => lc(n) === lc(name));
  if (!key) throw new Error(`The workbook has no "${name}" tab. It needs Company, Person, Interaction and Action tabs.`);
  return XLSX.utils.sheet_to_json(wb.Sheets[key], { defval: '', raw: true });
}
function col(row, ...names) {
  for (const n of names) {
    const k = Object.keys(row).find(h => lc(h) === lc(n));
    if (k !== undefined && str(row[k]) !== '') return row[k];
  }
  return '';
}
function xlDate(v) {
  if (v === '' || v == null) return '';
  if (typeof v === 'number') return new Date(Math.round((v - 25569) * 864e5)).toISOString().slice(0, 10);
  const s = str(v);
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  const p = new Date(s);
  return isNaN(p) ? '' : iso(p);
}
function importWorkbook(buf, filename) {
  const wb = XLSX.read(buf, { type: 'array' });
  const warn = [];
  const typeOf = t => COMPANY_TYPES.find(x => lc(x) === lc(t)) || (t ? 'Other' : 'Investor');

  const companies = [];
  readSheet(wb, 'Company').forEach((r, i) => {
    const name = str(col(r, 'Company Name'));
    if (!name) return;
    const t = str(col(r, 'Company Type'));
    if (t && !COMPANY_TYPES.some(x => lc(x) === lc(t))) warn.push(`Company "${name}": type "${t}" not recognised, shown as Other.`);
    companies.push({ id: +col(r, 'Company ID') || 100000 + i, type: typeOf(t), name,
      investorType: str(col(r, 'Investor Type')), investmentType: str(col(r, 'Investment Type')), notes: str(col(r, 'Notes')) });
  });
  const coByName = new Map(companies.map(c => [lc(c.name), c]));
  if (!companies.some(c => c.type === 'Demeisen')) warn.push('No company has type Demeisen, so owners and "Recorded by" lists will be empty.');

  const people = [];
  readSheet(wb, 'Person').forEach((r, i) => {
    const name = str(col(r, 'Person Name'));
    if (!name) return;
    const coName = str(col(r, 'Company Name'));
    const co = coByName.get(lc(coName));
    if (!co) { warn.push(`Person "${name}" skipped: company "${coName}" is not on the Company tab.`); return; }
    people.push({ id: +col(r, 'Person ID') || 100000 + i, name, email: str(col(r, 'Person Email')), companyId: co.id,
      title: str(col(r, 'Title', 'Job Title')), phone: str(col(r, 'Phone')), notes: str(col(r, 'Notes')) });
  });
  const pByName = new Map(people.map(p => [lc(p.name), p]));

  const interactions = [];
  readSheet(wb, 'Interaction').forEach((r, i) => {
    const desc = str(col(r, 'Interaction Desc'));
    const id = +col(r, 'Interaction ID') || 100000 + i;
    if (!desc && !str(col(r, 'Company Name'))) return;
    const coName = str(col(r, 'Company Name'));
    const co = coByName.get(lc(coName));
    if (coName && !co) warn.push(`Interaction ${id}: company "${coName}" is not on the Company tab.`);
    const viaName = str(col(r, 'Via (Prime CI)', 'Via'));
    const via = coByName.get(lc(viaName));
    if (viaName && !via) warn.push(`Interaction ${id}: via "${viaName}" is not on the Company tab.`);
    const ids = [];
    str(col(r, 'People Involved')).split(/[;\n]/).map(s => s.trim()).filter(Boolean).forEach(n => {
      const p = pByName.get(lc(n));
      if (p) { if (!ids.includes(p.id)) ids.push(p.id); } else warn.push(`Interaction ${id}: "${n}" is not on the Person tab.`);
    });
    const rbName = str(col(r, 'Recorded By'));
    const rb = pByName.get(lc(rbName));
    if (rbName && !rb) warn.push(`Interaction ${id}: recorded by "${rbName}" is not on the Person tab.`);
    const date = xlDate(col(r, 'Interaction Date'));
    if (!date) warn.push(`Interaction ${id}: no date.`);
    const lu = col(r, 'Last Updated');
    let upd = '';
    if (typeof lu === 'number') { const u = new Date(Math.round((lu - 25569) * 864e5)); upd = new Date(u.getUTCFullYear(), u.getUTCMonth(), u.getUTCDate(), u.getUTCHours(), u.getUTCMinutes()).toISOString(); }
    interactions.push({ id, type: /intel/i.test(str(col(r, 'Entry Type'))) ? 'Intel' : 'Interaction', date,
      companyId: co ? co.id : null, viaId: via ? via.id : null, format: str(col(r, 'Format')), people: ids,
      recordedBy: rb ? rb.id : null, desc, next: str(col(r, 'Interaction Next Steps')), review: str(col(r, 'Review')),
      ...(upd ? { updated: upd } : {}) });
  });
  const ixIds = new Set(interactions.map(x => x.id));

  const actions = [];
  readSheet(wb, 'Action').forEach((r, i) => {
    const desc = str(col(r, 'Action Desc'));
    if (!desc) return;
    const id = +col(r, 'Action ID') || 100000 + i;
    const ownerName = str(col(r, 'Owner'));
    const owner = pByName.get(lc(ownerName));
    if (ownerName && !owner) warn.push(`Action ${id}: owner "${ownerName}" is not on the Person tab.`);
    let interactionId = +col(r, 'Interaction ID') || null;
    if (interactionId && !ixIds.has(interactionId)) { warn.push(`Action ${id}: interaction ${interactionId} not found.`); interactionId = null; }
    const st = lc(col(r, 'Status'));
    actions.push({ id, desc, due: xlDate(col(r, 'Action Due Date')), ownerId: owner ? owner.id : null, interactionId,
      status: st === 'done' ? 'Done' : st === 'cancelled' || st === 'canceled' ? 'Cancelled' : 'Open', review: str(col(r, 'Review')) });
  });

  return { companies, people, interactions, actions,
    meta: { source: filename, loadedAt: new Date().toISOString(), warnings: warn } };
}

function renderStatus() {
  const el = document.getElementById('data-status');
  const m = db.meta;
  if (LIVE) {
    const email = idToken() ? claims(idToken()).email : '';
    el.innerHTML = `<strong>Live database</strong>${db.companies.length} companies, ${db.people.length} people, ${db.interactions.length} entries, ${db.actions.length} actions.${email ? ` Signed in as ${esc(email)}.` : ''}`;
    return;
  }
  if (!m || !m.source) { el.innerHTML = `<strong>Pro-forma</strong>Example data. Import your workbook to load your own; it stays in this browser only.${m?.changes ? ` <span class="unsaved">${m.changes} unsaved change${m.changes > 1 ? 's' : ''}</span>` : ''}`; return; }
  const when = new Date(m.loadedAt).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  el.innerHTML = `<strong>Your data</strong>Loaded from ${esc(m.source)} on ${when}: ${db.companies.length} companies, ${db.people.length} people, ${db.interactions.length} entries, ${db.actions.length} actions. Stored in this browser only.
    ${m.changes ? `<span class="unsaved">${m.changes} change${m.changes > 1 ? 's' : ''} not yet in a workbook. Use Save workbook.</span>` : m.savedAs ? `<span class="muted">Last saved to ${esc(m.savedAs)}.</span>` : ''}
    ${m.warnings.length ? `<details><summary>${m.warnings.length} item${m.warnings.length > 1 ? 's' : ''} could not be matched</summary><ul>${m.warnings.map(w => `<li>${esc(w)}</li>`).join('')}</ul></details>` : ''}`;
}
document.getElementById('import-file').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  if (typeof XLSX === 'undefined') { toast('The spreadsheet reader did not load. Check your connection and reload.'); return; }
  try {
    const next = importWorkbook(await file.arrayBuffer(), file.name);
    if (!next.companies.length) { toast('No companies found on the Company tab.'); return; }
    db = next; ss = blankSearch(); todoOwner = 'all';
    const stored = save(false);
    renderStatus(); route();
    toast(stored ? `Loaded ${db.interactions.length} entries from ${file.name}` : 'Loaded, but this browser would not store it; it will be lost on reload.');
  } catch (err) { toast(err.message || 'That file could not be read.'); }
});
/* ---------- Workbook export: same tabs and headers as the import, so a saved file loads straight back in ---------- */
// Excel date serials written directly, so no time-zone shift can move a date by a day.
const xd = s => s ? Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) / 864e5 + 25569 : '';
const xdt = s => { if (!s) return ''; const d = new Date(s); return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours(), d.getMinutes()) / 864e5 + 25569; };
function buildWorkbook() {
  const coName = id => company(id)?.name || '';
  const pName = id => person(id)?.name || '';
  const DATE_FMT = { 'Interaction Date': 'dd-mmm-yyyy', 'Action Due Date': 'dd-mmm-yyyy', 'Last Updated': 'dd-mmm-yyyy hh:mm' };
  const sheet = (rows, widths) => {
    const ws = XLSX.utils.json_to_sheet(rows);
    const range = XLSX.utils.decode_range(ws['!ref']);
    for (let c = range.s.c; c <= range.e.c; c++) {
      const z = DATE_FMT[ws[XLSX.utils.encode_cell({ r: 0, c })]?.v];
      if (z) for (let r = 1; r <= range.e.r; r++) { const cell = ws[XLSX.utils.encode_cell({ r, c })]; if (cell && cell.t === 'n') cell.z = z; }
    }
    ws['!cols'] = widths.map(w => ({ wch: w }));
    return ws;
  };
  const sortId = arr => [...arr].sort((a, b) => a.id - b.id);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, sheet(sortId(db.companies).map(c => ({ 'Company ID': c.id, 'Company Type': c.type, 'Company Name': c.name,
    'Investor Type': c.investorType || '', 'Investment Type': c.investmentType || '', 'Notes': c.notes || '' })), [11, 13, 36, 18, 18, 60]), 'Company');
  XLSX.utils.book_append_sheet(wb, sheet(sortId(db.people).map(p => ({ 'Person ID': p.id, 'Person Name': p.name, 'Person Email': p.email || '',
    'Company Name': coName(p.companyId), 'Title': p.title || '', 'Phone': p.phone || '', 'Notes': p.notes || '' })), [10, 26, 32, 34, 20, 16, 46]), 'Person');
  XLSX.utils.book_append_sheet(wb, sheet([...db.interactions].sort((a, b) => (a.date || '').localeCompare(b.date || '') || a.id - b.id).map(i => ({
    'Interaction ID': i.id, 'Entry Type': i.type, 'Interaction Date': xd(i.date), 'Company Name': coName(i.companyId), 'Format': i.format || '',
    'Via (Prime CI)': coName(i.viaId), 'People Involved': i.people.map(pName).filter(Boolean).join('; '), 'Interaction Desc': i.desc,
    'Interaction Next Steps': i.next || '', 'Recorded By': pName(i.recordedBy), 'Review': i.review || '',
    'Last Updated': xdt(i.updated) })), [12, 12, 14, 30, 12, 16, 40, 80, 40, 15, 36, 18]), 'Interaction');
  XLSX.utils.book_append_sheet(wb, sheet(sortId(db.actions).map(a => ({ 'Action ID': a.id, 'Action Desc': a.desc, 'Action Due Date': xd(a.due),
    'Status': a.status, 'Owner': pName(a.ownerId), 'Interaction ID': a.interactionId || '',
    'Company': coName(byId(db.interactions, a.interactionId)?.companyId), 'Review': a.review || '' })), [10, 62, 15, 10, 15, 13, 30, 40]), 'Action');
  return XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
}
document.getElementById('export').addEventListener('click', async () => {
  if (typeof XLSX === 'undefined') { toast('The spreadsheet reader did not load. Check your connection and reload.'); return; }
  const name = `Demeisen CRM ${iso(new Date())}.xlsx`;
  const blob = new Blob([buildWorkbook()], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  let savedAs = name;
  try {
    if (window.showSaveFilePicker) {
      // Chrome and Edge: lets you pick the folder and name, or choose an existing workbook to replace.
      const h = await window.showSaveFilePicker({ suggestedName: name, types: [{ description: 'Excel workbook', accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close(); savedAs = h.name;
    } else {
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }
  } catch (err) {
    if (err.name === 'AbortError') return;
    toast('This page is not allowed to save files here. Open the copy saved on your computer instead.'); return;
  }
  db.meta = db.meta || { source: '', loadedAt: new Date().toISOString(), warnings: [] };
  db.meta.changes = 0; db.meta.savedAs = savedAs; save(false);
  toast(`Saved ${savedAs}`);
});
const resetBtn = document.getElementById('reset');
let resetArmed = false;
resetBtn.addEventListener('click', () => {
  if (!resetArmed) { resetArmed = true; resetBtn.textContent = 'Click again: replaces loaded data'; setTimeout(() => { resetArmed = false; resetBtn.textContent = 'Reset to example data'; }, 4000); return; }
  db = seed(); save(false); resetArmed = false; resetBtn.textContent = 'Reset to example data'; ss = blankSearch(); renderStatus(); route(); toast('Example data restored');
});
async function start() {
  if (!LIVE) { renderStatus(); route(); return; }
  document.querySelector('label[for="import-file"]').style.display = 'none'; // imports would not reach the database
  resetBtn.textContent = 'Sign out';
  resetBtn.replaceWith(resetBtn.cloneNode(true));
  document.getElementById('reset').addEventListener('click', signOut);
  document.getElementById('export').textContent = 'Export to Excel';
  view.innerHTML = '<p class="muted">Loading…</p>';
  try {
    await finishSignIn();
    if (!idToken()) { await signIn(); return; }
    await reloadData();
    renderStatus(); route();
  } catch (e) { view.innerHTML = `<p class="form-error">${esc(e.message)}</p>`; }
}
start();
</script>
