AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Demeisen CRM proof of concept: private website bucket behind CloudFront, API (HTTP API and
  Lambda in the VPC), Cognito sign-in for invited users only, and a nightly CSV backup to S3.
  Uses the existing RDS database, which is created separately.

Parameters:
  VpcId: { Type: 'AWS::EC2::VPC::Id', Default: vpc-044079edc8236aae8 }
  SubnetIds: { Type: 'List<AWS::EC2::Subnet::Id>', Default: 'subnet-0fe9e26c230577f46,subnet-07db155fd72f5044d' }
  RouteTableId: { Type: String, Default: rtb-0e98492e877c1bd79 }
  DbHost: { Type: String, Default: demeisen-crm-poc.cb86go4u4eyw.eu-west-2.rds.amazonaws.com }
  DbResourceId: { Type: String, Default: db-5ICJRZAIB7KK3I2JZ5TRAPA5VI }
  DbSecurityGroupId: { Type: 'AWS::EC2::SecurityGroup::Id', Default: sg-08ca29742ceb6b0bc }
  DbUser: { Type: String, Default: crm_app }
  AuthDomainPrefix: { Type: String, Default: demeisen-crm-poc }
  BackupRetentionDays: { Type: Number, Default: 90 }

Resources:
  # ---------- Sign-in: invited users only, MFA required ----------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: demeisen-crm-poc
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig: { AllowAdminCreateUserOnly: true }
      MfaConfiguration: 'ON'
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      Policies:
        PasswordPolicy: { MinimumLength: 14, RequireLowercase: true, RequireUppercase: true, RequireNumbers: true, RequireSymbols: true }
      AccountRecoverySetting:
        RecoveryMechanisms: [{ Name: verified_email, Priority: 1 }]
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties: { Domain: !Ref AuthDomainPrefix, UserPoolId: !Ref UserPool }
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: crm-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      SupportedIdentityProviders: [COGNITO]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      CallbackURLs: [!Sub 'https://${Distribution.DomainName}/']
      LogoutURLs: [!Sub 'https://${Distribution.DomainName}/']
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      IdTokenValidity: 8
      AccessTokenValidity: 8
      TokenValidityUnits: { IdToken: hours, AccessToken: hours }

  # ---------- API ----------
  FunctionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Demeisen CRM API function
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 3306, ToPort: 3306, DestinationSecurityGroupId: !Ref DbSecurityGroupId, Description: MySQL }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, DestinationPrefixListId: pl-7ca54015, Description: S3 for backups }
  DbIngressFromFunction:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DbSecurityGroupId
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !Ref FunctionSecurityGroup
      Description: Demeisen CRM API function
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref RouteTableId]
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: 'sts:AssumeRole' }
      ManagedPolicyArns: ['arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole']
      Policies:
        - PolicyName: database-and-backup
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'rds-db:connect'
                Resource: !Sub 'arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbResourceId}/${DbUser}'
              - Effect: Allow
                Action: 's3:PutObject'
                Resource: !Sub '${BackupBucket.Arn}/*'
  Function:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: demeisen-crm-poc-api
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: src/index.handler
      MemorySize: 512
      Timeout: 60
      Role: !GetAtt FunctionRole.Arn
      # Placeholder only: scripts/deploy.ps1 uploads the real code straight after the stack is created.
      Code: { ZipFile: "exports.handler = async () => ({ statusCode: 503, body: 'Not deployed yet' });" }
      VpcConfig:
        SecurityGroupIds: [!Ref FunctionSecurityGroup]
        SubnetIds: !Ref SubnetIds
      Environment:
        Variables:
          DB_HOST: !Ref DbHost
          DB_USER: !Ref DbUser
          BACKUP_BUCKET: !Ref BackupBucket
  FunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Function}'
      RetentionInDays: 30
  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties: { Name: demeisen-crm-poc, ProtocolType: HTTP }
  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref Api
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings: { ThrottlingBurstLimit: 20, ThrottlingRateLimit: 10 }
  ApiAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref Api
      Name: cognito
      AuthorizerType: JWT
      IdentitySource: ['$request.header.Authorization']
      JwtConfiguration:
        Audience: [!Ref UserPoolClient]
        Issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt Function.Arn
      PayloadFormatVersion: '2.0'
  ApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: 'ANY /api/{proxy+}'
      AuthorizationType: JWT
      AuthorizerId: !Ref ApiAuthorizer
      Target: !Sub 'integrations/${ApiIntegration}'
  ApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Function
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/*/api/*'

  # ---------- Website ----------
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }]
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition: { StringEquals: { 'AWS:SourceArn': !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}' } }
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig: { Name: demeisen-crm-poc, OriginAccessControlOriginType: s3, SigningBehavior: always, SigningProtocol: sigv4 }
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig: { OriginAccessIdentity: '' }
          - Id: api
            DomainName: !Sub '${Api}.execute-api.${AWS::Region}.amazonaws.com'
            CustomOriginConfig: { OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2] }
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled, so updates show at once
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # SecurityHeadersPolicy
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # AllViewerExceptHostHeader

  # ---------- Nightly CSV backup: private, versioned, write-protected for the retention period ----------
  BackupBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'demeisen-crm-poc-backups-${AWS::AccountId}'
      ObjectLockEnabled: true
      VersioningConfiguration: { Status: Enabled }
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule: { DefaultRetention: { Mode: GOVERNANCE, Days: !Ref BackupRetentionDays } }
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }]
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-backups
            Status: Enabled
            ExpirationInDays: !Ref BackupRetentionDays
            NoncurrentVersionExpiration: { NoncurrentDays: 1 }
  BackupBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BackupBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: RequireTls
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt BackupBucket.Arn, !Sub '${BackupBucket.Arn}/*']
            Condition: { Bool: { 'aws:SecureTransport': 'false' } }
  BackupSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: demeisen-crm-poc-nightly-backup
      ScheduleExpression: cron(0 2 * * ? *)
      ScheduleExpressionTimezone: Europe/London
      FlexibleTimeWindow: { Mode: 'OFF' }
      Target:
        Arn: !GetAtt Function.Arn
        RoleArn: !GetAtt BackupScheduleRole.Arn
        Input: '{"backup":true}'
        RetryPolicy: { MaximumRetryAttempts: 2 }
  BackupScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - { Effect: Allow, Principal: { Service: scheduler.amazonaws.com }, Action: 'sts:AssumeRole', Condition: { StringEquals: { 'aws:SourceAccount': !Ref 'AWS::AccountId' } } }
      Policies:
        - PolicyName: invoke-function
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - { Effect: Allow, Action: 'lambda:InvokeFunction', Resource: !GetAtt Function.Arn }

Outputs:
  SiteUrl: { Value: !Sub 'https://${Distribution.DomainName}/' }
  SiteBucketName: { Value: !Ref SiteBucket }
  BackupBucketName: { Value: !Ref BackupBucket }
  FunctionName: { Value: !Ref Function }
  DistributionId: { Value: !Ref Distribution }
  ClientId: { Value: !Ref UserPoolClient }
  AuthDomain: { Value: !Sub '${AuthDomainPrefix}.auth.${AWS::Region}.amazoncognito.com' }
  UserPoolId: { Value: !Ref UserPool }
